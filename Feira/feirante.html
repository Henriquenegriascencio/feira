<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Feirante - Feira da Lua</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <nav class="border-b border-slate-800 bg-slate-900/80 p-4 flex justify-between items-center">
        <h1 class="font-bold text-amber-400 text-lg">🌙 FEIRA DA LUA <span class="text-xs text-slate-400 border border-amber-400/30 px-2 py-0.5 rounded ml-2">Espaço do Feirante</span></h1>
        <button id="btnLogout" class="text-xs bg-red-500/20 text-red-400 px-3 py-1.5 rounded border border-red-500/30">Sair</button>
    </nav>

    <main class="p-6 max-w-4xl mx-auto space-y-6">
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
            <div>
                <p class="text-xs text-slate-400">Bem-vindo(a),</p>
                <h2 id="feiranteNome" class="text-lg font-bold text-amber-400">...</h2>
            </div>
        </div>

        <section class="bg-slate-900 p-5 rounded-xl border border-slate-800 space-y-4">
            <h3 class="text-sm font-semibold text-slate-200">Meus Pagamentos e Histórico</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-800/60 text-slate-400">
                        <tr>
                            <th class="p-2">Data da Feira</th>
                            <th class="p-2">Valor</th>
                            <th class="p-2">Status</th>
                            <th class="p-2">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaFeirante" class="divide-y divide-slate-800">
                        <!-- Dados dinâmicos -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module" src="js/feirante.js"></script>
</body>
</html>
