<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feira da Lua - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-amber-400">🌙 FEIRA DA LUA</h1>
            <p class="text-xs text-slate-400 mt-1">Controle Cósmico de Feiras e Pagamentos</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">E-mail</label>
                <input type="email" id="email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Senha</label>
                <input type="password" id="password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
            </div>

            <div id="errorMessage" class="text-xs text-red-400 hidden"></div>

            <button type="submit" id="btnLogin" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold py-2 rounded-lg text-sm transition">
                Entrar no Sistema
            </button>
        </form>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
